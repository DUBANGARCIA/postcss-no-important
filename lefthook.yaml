pre-commit:
  parallel: false
  jobs:
    - run: mise trust
    - run: mise install --yes
    - run: eval "$(mise env)"
  commands:
    prettier:
      priority: 1
      glob: '*.{js,cjs,mjs,ts,cts,mts,json,md,yaml,yml}'
      run: bun --bun prettier --write --cache {staged_files}
      stage_fixed: true
    eslint:
      priority: 2
      glob: '*.{js,cjs,mjs,ts,cts,mts}'
      run: bun --bun eslint --config eslint.config.js --cache --fix {staged_files}
      stage_fixed: true
    sort-package-json:
      priority: 3
      glob: '**/package.json'
      run: bun sort-package-json {staged_files}
      stage_fixed: true
    toml:
      priority: 4
      glob: '*.toml'
      run: bun --bun taplo fmt {staged_files}
      stage_fixed: true
    actionlint:
      priority: 2
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}

commit-msg:
  parallel: false
  jobs:
    - run: mise trust
    - run: mise install --yes
    - run: eval "$(mise env)"
  commands:
    commitlint:
      run: bun --bun commitlint --config commitlint.config.js --edit "$1"

post-checkout, post-merge, post-rewrite:
  parallel: false
  jobs:
    - run: mise trust
    - run: mise install --yes
    - run: eval "$(mise env)"
  commands:
    bun-install:
      glob: '{package.json,bun.lock,bunfig.toml}'
      run: bun install --frozen-lockfile
      only:
        - changed
